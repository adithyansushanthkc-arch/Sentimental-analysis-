<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4f46e5 100%); min-height: 100vh;">

<div class="container-fluid" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- Brand Header -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);">
                    <i class="fa-solid fa-graduation-cap text-white" style="font-size:1.8rem;"></i>
                </div>
                <h2 class="text-white fw-bold mb-1">Student Feedback System</h2>
                <p class="text-white" style="opacity:.7;">Sentiment Analysis Platform</p>
            </div>

            <div class="card border-0" style="border-radius:20px;box-shadow:0 25px 60px rgba(0,0,0,.3);">
                <div class="card-body p-5">
                    <h4 class="fw-bold mb-1" style="color:#0f172a;">Sign in</h4>
                    <p class="text-muted mb-4" style="font-size:.9rem;">Welcome back! Please enter your credentials.</p>

                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>Invalid email or password.</span>
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>You have been logged out successfully.</span>
                    </div>

                    <div th:if="${registerSuccess}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
                        <i class="fa-solid fa-circle-check"></i>
                        <span th:text="${registerSuccess}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold" style="font-size:.88rem;">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope" style="color:#4f46e5;"></i></span>
                                <input type="email" class="form-control" id="username" name="username"
                                       placeholder="Enter your email" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold" style="font-size:.88rem;">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock" style="color:#4f46e5;"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Enter your password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4 d-flex align-items-center justify-content-between">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                <label class="form-check-label text-muted" for="remember-me" style="font-size:.88rem;">Remember me</label>
                            </div>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold" style="border-radius:12px;padding:.75rem;">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                            </button>
                        </div>
                        <p class="text-center text-muted mb-0" style="font-size:.88rem;">
                            Don't have an account?
                            <a href="/register" class="fw-semibold text-decoration-none" style="color:#4f46e5;">Register here</a>
                        </p>
                    </form>
                </div>
            </div>

            <p class="text-center mt-4" style="color:rgba(255,255,255,.5);font-size:.78rem;">
                &copy; 2025 Student Feedback Sentiment Analysis System
            </p>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });
</script>
</body>
</html>
