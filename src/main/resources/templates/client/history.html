<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Analysis History')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: sidebar-client}"></div>

    <div class="flex-grow-1 p-4 overflow-auto animate-in" style="height:100vh; background:var(--bg);">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1"><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Analysis History</h4>
                <p class="text-muted mb-0" style="font-size:.9rem;">View and manage your uploaded feedback files.</p>
            </div>
            <a href="/client/upload" class="btn btn-primary fw-semibold">
                <i class="fa-solid fa-upload me-1"></i> Upload New
            </a>
        </div>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2">
            <i class="fa-solid fa-circle-check"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Table Card -->
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <span><i class="fa-solid fa-list me-2 text-primary"></i>Uploaded Files</span>
                <span class="badge bg-primary rounded-pill" th:text="${#lists.size(uploads)} + ' file(s)'" style="font-size:.78rem;"></span>
            </div>
            <div class="card-body p-0">
                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(uploads)}" class="text-center py-5 text-muted">
                    <i class="fa-solid fa-inbox fa-3x mb-3 d-block" style="opacity:.25;"></i>
                    <p class="mb-2">No files uploaded yet.</p>
                    <a href="/client/upload" class="btn btn-primary btn-sm">
                        <i class="fa-solid fa-upload me-1"></i>Upload your first CSV
                    </a>
                </div>

                <div class="table-responsive" th:if="${!#lists.isEmpty(uploads)}">
                    <table class="table table-hover align-middle m-0">
                        <thead style="background:var(--bg);">
                            <tr>
                                <th class="ps-4">File Name</th>
                                <th>Upload Date</th>
                                <th>Records</th>
                                <th>Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${uploads}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fa-solid fa-file-csv text-success"></i>
                                        <span class="fw-semibold" style="font-size:.9rem;" th:text="${u.fileName}">file.csv</span>
                                    </div>
                                </td>
                                <td class="text-muted" style="font-size:.88rem;"
                                    th:text="${#temporals.format(u.uploadDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                                <td>
                                    <span class="badge bg-secondary rounded-pill" th:text="${u.totalRecords} + ' rows'">0 rows</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${u.status == 'Uploaded'} ? 'bg-warning text-dark' : 'bg-success'"
                                          th:text="${u.status}">Uploaded</span>
                                </td>
                                <td class="text-center">
                                    <!-- Analyze button for uploaded files -->
                                    <th:block th:if="${u.status == 'Uploaded'}">
                                        <form th:action="@{/client/analyze/{id}(id=${u.id})}" method="post" class="d-inline"
                                              onsubmit="this.querySelector('button').disabled=true; this.querySelector('button').innerHTML='<span class=\'spinner-border spinner-border-sm me-1\'></span>Analyzing...'">
                                            <button type="submit" class="btn btn-sm btn-primary fw-semibold">
                                                <i class="fa-solid fa-magnifying-glass-chart me-1"></i>Analyze
                                            </button>
                                        </form>
                                    </th:block>
                                    <!-- View Results for analyzed files -->
                                    <th:block th:if="${u.status == 'Analyzed'}">
                                        <a th:href="@{/client/results/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary fw-semibold me-1">
                                            <i class="fa-solid fa-eye me-1"></i>Results
                                        </a>
                                        <a th:href="@{/client/suggestions}" class="btn btn-sm btn-outline-success fw-semibold">
                                            <i class="fa-solid fa-lightbulb me-1"></i>Suggestions
                                        </a>
                                    </th:block>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
