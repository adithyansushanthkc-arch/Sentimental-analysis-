<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Analysis Records')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: sidebar-admin}"></div>

    <div class="flex-grow-1 p-4 overflow-auto animate-in" style="height:100vh; background:var(--bg);">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1"><i class="fa-solid fa-chart-bar me-2 text-primary"></i>Analysis Records</h4>
                <p class="text-muted mb-0" style="font-size:.9rem;">All sentiment analysis records across all users.</p>
            </div>
            <span class="badge bg-primary rounded-pill fs-6 py-2 px-3"
                  th:text="${#lists.size(records)} + ' records'"></span>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(records)}" class="card text-center py-5">
            <div class="card-body">
                <i class="fa-solid fa-chart-bar fa-3x text-muted mb-3 d-block" style="opacity:.25;"></i>
                <h5 class="text-muted">No analysis records yet</h5>
                <p class="text-muted" style="font-size:.9rem;">Records will appear here once users upload and analyze feedback.</p>
            </div>
        </div>

        <div class="card" th:if="${!#lists.isEmpty(records)}">
            <div class="card-header"><i class="fa-solid fa-list me-2 text-primary"></i>All Analysis Records</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0" style="font-size:.88rem;">
                        <thead style="background:var(--bg);">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Uploaded By</th>
                                <th>File Name</th>
                                <th>Date</th>
                                <th class="text-center">Total</th>
                                <th class="text-center">Positive</th>
                                <th class="text-center">Negative</th>
                                <th class="text-center">Neutral</th>
                                <th class="text-center">Avg Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${records}">
                                <td class="ps-4">
                                    <span class="badge bg-secondary" th:text="'#' + ${r.id}"></span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div style="width:28px;height:28px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#4f46e5;"
                                             th:text="${#strings.toUpperCase(#strings.substring(r.user.name, 0, 1))}">A</div>
                                        <span th:text="${r.user.name}">Name</span>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fa-solid fa-file-csv text-success" style="font-size:.85rem;"></i>
                                        <span th:text="${r.upload.fileName}">file.csv</span>
                                    </div>
                                </td>
                                <td class="text-muted"
                                    th:text="${#temporals.format(r.analysisDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                                <td class="text-center fw-bold" th:text="${r.totalFeedback}">0</td>
                                <td class="text-center">
                                    <span class="badge badge-positive" th:text="${r.positiveCount}">0</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge badge-negative" th:text="${r.negativeCount}">0</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge badge-neutral" th:text="${r.neutralCount}">0</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge bg-secondary"
                                          th:text="${#numbers.formatDecimal(r.averageScore, 1, 2)}">0.00</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
